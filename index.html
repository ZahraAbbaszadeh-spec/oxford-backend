<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>واژگان آکسفورد سه‌جلدی — وضعیت سرور</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f7f3ec; color: #14213d; margin: 0; padding: 24px; }
  .card { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 16px; padding: 24px 28px; box-shadow: 0 4px 24px rgba(20,33,61,.08); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #5b6b82; font-size: 13px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eef1f4; font-size: 14px; }
  .ok { color: #0e7a5f; font-weight: 700; }
  .bad { color: #b3261e; font-weight: 700; }
  button { background: #0e7a8a; color: #fff; border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; cursor: pointer; margin-top: 16px; }
  pre { background: #f2f5f7; border-radius: 10px; padding: 12px; font-size: 12px; overflow: auto; direction: ltr; text-align: left; }
</style>
</head>
<body>
<div class="card">
  <h1>واژگان آکسفورد سه‌جلدی — بک‌اند مستقل</h1>
  <div class="sub">این صفحه فقط برای اطمینان از زنده‌بودن سرور است؛ رابط اصلی اپ در فاز بعد می‌آید.</div>
  <div id="rows">در حال بررسی…</div>
  <button id="btn">تست اتصال Gemini (معنی واژهٔ ankle)</button>
  <pre id="out" hidden></pre>
</div>
<script>
  const rows = document.getElementById('rows');
  fetch('/health').then(r => r.json()).then(h => {
    rows.innerHTML =
      '<div class="row"><span>وضعیت سرور</span><span class="' + (h.ok ? 'ok' : 'bad') + '">' + (h.ok ? 'زنده ✓' : 'خطا') + '</span></div>' +
      '<div class="row"><span>درس‌های بارگذاری‌شده</span><span>' + h.lessons + '</span></div>' +
      '<div class="row"><span>واژه‌های کتاب</span><span>' + h.words + '</span></div>' +
      '<div class="row"><span>کلید Gemini روی سرور</span><span class="' + (h.geminiConfigured ? 'ok' : 'bad') + '">' + (h.geminiConfigured ? 'تنظیم شده ✓' : 'تنظیم نشده') + '</span></div>';
  }).catch(() => { rows.textContent = 'سرور پاسخ نداد.'; });

  document.getElementById('btn').onclick = async () => {
    const out = document.getElementById('out');
    out.hidden = false; out.textContent = '...';
    try {
      const r = await fetch('/api/meaning?word=ankle');
      out.textContent = JSON.stringify(await r.json(), null, 2);
    } catch (e) { out.textContent = String(e); }
  };
</script>
</body>
</html>
